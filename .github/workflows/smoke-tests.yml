# Runs the headless smoke tests in tests/smoke on every push to main and every pull request.
name: Smoke tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Must match docs/engine-reference/godot/VERSION.md.
  GODOT_VERSION: 4.7.2-stable

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot (checksum verified)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          zip="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o "$zip" "$base/$zip"
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep " $zip\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip" && rm "$zip"
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot

      - name: Import project
        # .godot/ is not committed; import once so class names and resources resolve.
        run: ~/godot/godot --headless --path src --import

      - name: Run smoke tests
        # Godot can exit 0 even when a script fails to parse, so also require the
        # script's own "DONE fails=0" line.
        run: |
          set -uo pipefail
          status=0
          for t in tests/smoke/*.gd; do
            echo "::group::$t"
            out="$(~/godot/godot --headless --path src -s "../$t" 2>&1)"
            code=$?
            echo "$out"
            echo "::endgroup::"
            if [ $code -ne 0 ] || ! grep -q "^DONE fails=0" <<<"$out"; then
              echo "::error file=$t::smoke test failed (exit $code)"
              status=1
            fi
          done
          exit $status
